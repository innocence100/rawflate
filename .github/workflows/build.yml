name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      update_needed: ${{ steps.latest.outputs.update_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: latest
        run: |
          TAG=$(curl -sL https://api.github.com/repos/microsoft/preflate-rs/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          CURRENT=$(grep 'tag =' Cargo.toml | sed 's/.*tag = "//;s/".*//')
          echo "current=$CURRENT  latest=$TAG"
          if [ "$TAG" != "$CURRENT" ]; then
            echo "update_needed=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-update
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: rawflate
          - os: windows-latest
            binary: rawflate.exe
          - os: macos-latest
            binary: rawflate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: update preflate-rs dep
        if: needs.check-update.outputs.update_needed == '1'
        run: |
          sed -i 's/tag = "[^"]*"/tag = "${{ needs.check-update.outputs.tag }}"/' Cargo.toml

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rawflate-${{ matrix.os }}
          path: target/release/${{ matrix.binary }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rawflate-ubuntu-latest/rawflate
            rawflate-windows-latest/rawflate.exe
            rawflate-macos-latest/rawflate
          fail_on_unmatched: false

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: rawflate
          - os: windows-latest
            binary: rawflate.exe
          - os: macos-latest
            binary: rawflate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: clone preflate-rs (patched fork)
        shell: bash
        run: |
          git clone --depth 1 --branch raw-format \
            https://github.com/innocence100/preflate-rs.git ../preflate-rs

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rawflate-${{ matrix.os }}
          path: target/release/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: generate tag
        id: tag
        run: echo "version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4

      - name: rename binaries
        shell: bash
        run: |
          mv rawflate-ubuntu-latest/rawflate   rawflate-linux
          mv rawflate-macos-latest/rawflate    rawflate-macos
          mv rawflate-windows-latest/rawflate.exe rawflate-windows.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          files: |
            rawflate-linux
            rawflate-macos
            rawflate-windows.exe
          fail_on_unmatched_files: true

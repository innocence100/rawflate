name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: rawflate
          - os: windows-latest
            binary: rawflate.exe
          - os: macos-latest
            binary: rawflate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rawflate-${{ matrix.os }}
          path: target/release/${{ matrix.binary }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rawflate-ubuntu-latest/rawflate
            rawflate-windows-latest/rawflate.exe
            rawflate-macos-latest/rawflate
          fail_on_unmatched: false
